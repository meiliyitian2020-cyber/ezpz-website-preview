tures or acquisition of <strong>virtual items (such as Diamonds)</strong> may require payment. Prices will be displayed on the Services.</li>\n</ul>\n<p><strong>&nbsp;</strong></p>\n<p><strong>7.2 Earnings</strong></p>\n<ul>\n<li>You may earn various <strong>virtual items</strong> (such as virtual crystals, virtual coins) by participating in platform activities, completing tasks, or through other promotional mechanisms as described within the Services. However, the ability to withdraw any earnings for real-world currency is <strong>not a standard feature of the Services</strong>. <strong>Withdrawl is permitted exclusively for &ldquo;Credits&rdquo; earned by users who have entered a boradcaster agreement with the Company, and is strictly governed by the terms of that broadcaster agreement</strong>.</li>\n</ul>\n<p><strong>&nbsp;</strong></p>\n<p><strong>7.3 Payments</strong></p>\n<ul>\n<li>Payments will be made according to the methods described in relevant Platform Rules and recharge agreement, as published on the Services.</li>\n</ul>\n<p><strong>&nbsp;</strong></p>\n<p><strong>7.4 Taxes</strong></p>\n<ul>\n<li>You are responsible for all applicable taxes, fees, or charges arising from transactions. The Company is not liable for reporting or remitting these taxes unless required by law.</li>\n</ul>\n<p><strong>&nbsp;</strong></p>\n<p><strong>7.5 Non-Refund Policy</strong></p>\n<p>Except as required by applicable law, all purchases of virtual items, including Diamonds, are final and non-refundable.</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><strong>Ⅷ</strong><strong>. DISCLAIMERS OF WARRANTIES</strong></p>\n<ul>\n<li>The Services and Platform Materials are provided <strong>&ldquo;as is&rdquo;</strong>, without warranties, express or implied, including but not limited to merchantability, fitness for a particular purpose, title, and non-infringement.</li>\n<li>The Company does not guarantee the Services will be error-free, secure, uninterrupted, or free of delays.</li>\n<l rong> for such interruptions but will provide notice when practicable.</li>\n</ul>\n<p><strong>&nbsp;</strong></p>\n<p><strong>10.2 Modification</strong></p>\n<ul>\n<li>The Company may change, modify, reprice, or discontinue any part of the Services, temporarily or permanently, with or without notice.</li>\n<li>Continued use of the Services after modifications constitutes acceptance. You may discontinue use if you do not agree with such changes.</li>\n</ul>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><strong>Ⅺ</strong><strong>. GOVERNING LAW AND DISPUTE RESOLUTION</strong></p>\n<p><strong>11.1 Governing Law</strong></p>\n<ul>\n<li>This Agreement is governed by the laws of <strong>Singapore</strong>, without regard to conflict of laws principles, regardless of your location.</li>\n<li>The <strong>United Nations Convention on Contracts for the International Sale of Goods (1980)</strong> is explicitly excluded.</li>\n</ul>\n<p>&nbsp;</p>\n<p><strong>11.2 Dispute Resolution</strong></p>\n<ul>\n<li>Any dispute, controversy, difference, or claim arising out of or relating to this Agreement (including non-contractual obligations) shall be <strong>finally resolved by arbitration</strong> administered by the <strong>Singapore International Arbitration Centre (SIAC)</strong> under the <strong>SIAC Administered Arbitration Rules</strong> in force at the time the notice of arbitration is submitted.</li>\n</ul>\n<p><strong>Seat of arbitration:</strong> Singapore.</p>\n<p><strong>Number of arbitrators:</strong> One.</p>\n<p><strong>Language:</strong> English.</p>\n<ul>\n<li>If the arbitration clause is held entirely invalid or unenforceable, disputes shall be resolved <strong>exclusively by courts of competent jurisdiction in Singapore</strong>, and you <strong>waive all defenses</strong> of lack of personal jurisdiction, forum non conveniens, or otherwise to the venue of any such action or proceeding.</li>\n</ul>\n<p>&nbsp;</p>\n<p><strong>11.3 Equitable Relief</strong></p>\n<ul>\n<li>You acknowledge that the rights granted to the Company under this Agreement are <strong>unique and irreplaceable</strong>, and any breach may cause <strong>immediate and irreparable harm</strong> for which legal remedies are inadequate.</li>\n<li>The Company is entitled to seek <strong>injunctive or other equitable relief</strong> without posting bond or surety in the event of breach or anticipated breach.</li>\n<li>You <strong>irrevocably waive any right to seek injunctive or equitable relief</strong> against the Company.</li>\n</ul>\n<p>&nbsp;</p>\n<p><strong>11.4 User Disputes</strong></p>\n<ul>\n<li>You are solely responsible for your interactions with other users or third parties via the Services.</li>\n<li>The Company <strong>disclaims any liability</strong> arising from disputes between you and other users.</li>\n<li>The Company may, at its discretion but is <strong>not obligated</strong>, to manage disputes between users.</li>\n</ul>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><strong>XII. ADDITIONAL PROVISIONS</strong></p>\n<p><strong>12.1 User Equipment and Costs</strong></p>\n<ul>\n<li>You are responsible for obtaining and maintaining all devices, hardware, and software necessary to access and use the Services, and for all associated charges.</li>\n</ul>\n<p>&nbsp;</p>\n<p><strong>12.2 Notifications</strong></p>\n<ul>\n<li>Notifications from the Company may be delivered via: webpage announcements, in-app pop-ups, email, text messages, or postal mail; such notifications are deemed received on the date sent.</li>\n<li>Notifications from you to the Company should be sent to the contact information officially provided.</li>\n</ul>\n<p>&nbsp;</p>\n<p><strong>12.3 Entire Agreement</strong></p>\n<ul>\n<li>This Agreement constitutes the <strong>entire agreement</strong> between you and the Company regarding the Services.</li>\n<li>Additional terms may apply for affiliate or third-party services, content, or software.</li>\n<li>Failure by the Company to enforce any provision does not constitute waiver.</li>\n<li>Invalid provisions shall not affect the remainder of the Agreement, and courts should endeavor to give effect to parties&rsquo; intentions.</li>\n<li>Neither trade practice nor conduct can modify this Agreement.</li>\n<li>You may not assign this Agreement without prior written consent; the Company may freely assign it.</li>\n<li>Section headings are for convenience only.</li>\n<li>You must provide documentation or releases as requested to verify compliance.</li>\n<li>You waive defenses based on the electronic form or lack of signature.</li>\n<li>Provisions that naturally survive termination will remain effective.</li>\n</ul>\n<p>&nbsp;</p>\n<p><strong>12.4 Third-Party Services and Rights</strong></p>\n<ul>\n<li>The Company may use or link to third-party services and websites; such use <strong>does not imply endorsement or liability</strong>.</li>\n<li>You acknowledge and accept <strong>all risks</strong> arising from interactions with third-party services, including advertisements.</li>\n<li>The Company may place commercial or non-commercial advertisements, and you agree to receive such communications via email, SMS, or other lawful means.</li>\n<li>No third-party rights or benefits are conferred by this Agreement.</li>\n</ul>\n<p>&nbsp;</p>\n<p><strong>12.5 International Use and Export Control</strong></p>\n<ul>\n<li>In case of discrepancies between language versions, the <strong>English version prevails</strong>.</li>\n<li>Software and data transmitted via the Services are subject to <strong>Singapore export laws</strong>. You must not download, export, or re-export in violation of these laws.</li>\n<li>You represent and warrant that you:\n<ol>\n<li>Are not located in any country under Singapore government embargo or designated as a &ldquo;terrorist supporting&rdquo; country;</li>\n<li>Are not listed on any Singapore government prohibited or restricted parties lists.</li>\n</ol>\n</li>\n<li>You agree to comply with <strong>all local laws and rules</strong>, particularly regarding online conduct and content.</li>\n<li>The Services may not be exported or re-exported in violation of <strong>S. law</strong>, including restrictions related to embargoed countries or individuals on U.S. sanctioned lists.</li>\n<li>You represent and warrant that you will not use the Services for prohibited purposes, including development or production of nuclear, missile, chemical, or biological weapons.</li>\n</ul>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n</div>",
  "privacy": "<div style=\"font-size: 14px; direction: ltr; color: #000; font-weight: 400; line-height: 1.2; font-family: system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',sans-serif; -webkit-tap-highlight-color: transparent;\" data-wrap=\"\">\n<p><strong>Privacy Policy</strong></p>\n<p>Last Updated: 02/02/2026</p>\n<p>Welcome and thank you for choosing EZPZ. EZPZ provides an online and mobile gaming, messaging and social networking platform via a mobile application (the &ldquo;App&rdquo;), the website (the &ldquo;Site&rdquo;), and related Internet services (collectively, the &ldquo;Services&rdquo;). EZPZ is operated by HAGO&nbsp;Singapore&nbsp;PTE.LTD. (&ldquo;we&rdquo;, &ldquo;our&rdquo; or &ldquo;us&rdquo;), with its registered address at 30 Pasir Panjang Road, #15-31A, Mapletree Business City, Singapore 117440. This Privacy Policy is incorporated into, and is subject to, our&nbsp;&nbsp;&nbsp;(the &ldquo;Terms&rdquo;). Capitalized terms that are not defined in this Privacy Policy (&ldquo;Policy&rdquo;) shall have the meaning given to them in the Terms.</p>\n<p>We are fully aware of the importance of personal information to you and will do our best to protect the security and reliability of your personal information. We will not use or share your information with anyone except as described in this Privacy Policy. Before using our products or Services, please be sure to read and fully understand this&nbsp;Privacy Policy.&nbsp;In particular,&nbsp;you should pay close attention to&nbsp;the&nbsp;<strong>bolded</strong>&nbsp;clauses, which may relate to your rights. Please only continue to use our products and Services after confirming that you fully understand and agree to our Terms and this Privacy Policy. Once you start using the App, Site, Software, or other Services, you will be deemed to have fully understood and agreed to the provisions of this Privacy Policy. If you do not or no longer agree with this Privacy Policy, please stop your access and use of the App, Site, Software, and other Services.</p>\n<ol>\n<li><strong> INFORMATION WE COLLECT &amp; HOW WE COLLECT YOUR INFORMATION</strong></li>\n<li>Information We Collect</li>\n</ol>\n<p>As long as quality of the Services can be guaranteed, we will endeavor to collect as little of your personal information as possible. The information we collect from you for the performance of our Services is as follows:</p>\n<ul>\n<li>Account information: Such as phone number, email address, login password, third-party account information.</li>\n<li>Device Information: Such as device ID, operating system, IP address, country code, device type and versions, mobile network operator, etc.</li>\n<li>Your Profile Information: Such as profile photo, date of birth, gender, nickname, personalized signature, longitude and latitude, geological location, etc.</li>\n<li>Contacts: Your contacts.</li>\n<li>User Content &amp; Behavior Information: Such as browsing history, searching history, friend list, comments, messages, audio-video streaming data, etc.</li>\n<li>Virtual Currency &amp; Payment Information: order number, recharge information, payment method, virtual currency balance, user props and rights, etc.</li>\n<li>Other data inferred from or associated with any of the above, such as any metadata accompanying user generated content, audio-visual clips segmentation, annotation, frame or text extraction, object and image recognition symbolling, aggregated classification tagging and other non-personally identifying information inferred from data you provide to us or that we collect about you in connection with your use of the Services. If the App crashes or stops responding, we may collect or trace your&nbsp;log&nbsp;information.</li>\n<li>Answers for retrieving your account password: You may choose to set password retrieving questions and in that case, the answers you provide for the verification questions will be collected, such information may include: Part of your ID number, your birthday or your parents&rsquo; birthday, etc. This information will only be collected when you set them as the answers for password retrieving.</li>\n<li>Preferences: Such as your preferences, hobbies, etc.</li>\n</ul>\n<p>You may refer to&nbsp;<u>Appendix 1</u>&nbsp;of this Privacy Policy for more details about information we collect from you.</p>\n<ol start=\"2\">\n<li>How We Collect Your Information</li>\n<li>Information we collect from you. We collect information that you voluntarily submit or provide to us, including (without limitation) when you download our App, create an account, interact with any of the Services, or otherwise contact us with a question, comment, feedback or request.</li>\n<li>Information we collect from your device.&nbsp;<strong>We, and our service providers, may automatically collect certain network and device information from your computer or mobile device once you activate our Services, such as your IP address, your geographic location, operating system, model of your device, etc.</strong>This information allows us to recognize you and personalize your experience if you return to the Services. We, and our service providers, may collect this information using &ldquo;cookies&rdquo;. More information about our use of cookies can be found in the &ldquo;Cookies&rdquo; section below. We may automatically collect such information over time and across different websites or Services or across different devices from which you log onto or access our Services by.</li>\n</ol>\n<p>You may refer to&nbsp;<u>Appendix 2</u>&nbsp;of this Privacy Policy for more details on the information we collect from your devices.</p>\n<ol>\n<li>Information obtained from third parties. You may give us permission to collect your information from third parties and other sources, or the services provided by them (this may include social networking services, creator agencies, web hosting providers, analytics providers, attribution providers, advertising or other business partners and/or other public resources). To the extent that we allow third party social media integration in the Services, the information we may obtain from third party services depends on your account/privacy settings with those third parties and the privacy policies of such third parties. If you access the Services through third party platforms, you are authorizing us to collect, store and use such information and content in accordance with this Policy. For example, you may connect a social networking service such as Facebook or Google to the account you are opening or have opened with us. When you do this, you may allow us to obtain your information from those accounts, such as your nickname, avatar, friends or contacts.</li>\n<li><strong> HOW WE USE AND DISCLOSE YOUR INFORMATION</strong></li>\n<li>How We Use Your Information</li>\n</ol>\n<p>We use the information you provide in a manner that is consistent with this Privacy Policy. Generally, we use the information that we have collected to operate and maintain our Services and to respond to your requests and concerns. If you provide information for a certain reason, we will use the information in connection with the reason for which it was provided. Below are some ways in which we use your information:</p>\n<ul>\n<li>provide EZPZ Services and present content to you, including interactive features on the Platform, and to provide you with information or Services that you request or allow us to;</li>\n<li>register, establish, maintain, and manage user accounts;</li>\n<li>ensure that you are old enough to use our Services (as required by law);</li>\n<li>ensure content is presented in the most effective manner for you and your device;</li>\n<li>provide you with location-based services (where those services are available in your jurisdiction);</li>\n<li>enable you to use payment-related functions within our services, including but not limited to account recharges, the purchase of virtual items, and ith selected third parties.</li>\n<li>Our affiliates or group members: We may also share your information with other members, subsidiaries, or affiliates of our corporate group, to provide the Services to you, including enabling interactions with the apps or sites of our affiliates, improving and optimizing the platform, preventing illegal use and supporting users.</li>\n<li>Law Enforcement: We will share your information with law enforcement agencies, public authorities or other organizations if we are legally required to do so, or if such use is reasonably necessary to: 1) comply with any legal obligations, processes or requests; 2) enforce our Terms of Service and other agreements, policies, and standards, including investigating any potential breach thereof; 3) detect, prevent or otherwise address security, fraud or technical issues; or 4) protect the rights, property or security of ourselves, our users, a third party or the public as required or permitted by law.</li>\n<li>Public content: You may submit certain information or content through the Services, such as comments, feedback, audio clips, video clips, etc. Any such information that is meant to be shown to the public on our App will be disclosed publicly. This policy does not apply to uses of any such information by third parties.</li>\n</ol>\n<p><strong>III. STORAGE AND PROCESSING OF YOUR INFORMATION</strong></p>\n<ol>\n<li>Storage of Your Information</li>\n</ol>\n<p>Your information collected through the Service may be processed and/or stored in Singapore or any other country in which we, our service provider or affiliates maintain servers. We may transfer information that we collected about you, including personal information, from your country or jurisdiction to other countries or jurisdictions around the world in accordance with the laws of the country you live.</p>\n<ol start=\"2\">\n<li>Retention of Your Information</li>\n</ol>\n<p>If you have an account with us, we will retain your information for as long as your account is active or as needed to be ready to provide you services. We will retain and use your information as necessary to comply with our legal obligations, resolve disputes and enforce our agreements within the limits of applicable law.</p>\n<p>If you are a visitor or temporary user of our Services, we will retain your information for as long as necessary but no longer than as required by applicable laws after your last visit to our Services.</p>\n<p>To dispose of personal information, we may anonymize it, delete it or take other appropriate steps. Information may persist in copies made for backup and business continuity purposes for a longer time and will not be retained for longer than is required for the above-mentioned purposes or as otherwise required under the applicable laws.</p>\n<ol start=\"3\">\n<li>International Transfer of Your Information</li>\n</ol>\n<p>We may transfer your information to other countries or regions solely for the purposes set out in this Policy, in accordance with this Policy and applicable laws and regulations. Information disclosure as referred to in this Policy may involve a transfer of your information to countries and regions that provide different levels of data protection. Applicable legal and regulatory requirements are taken into consideration before any cross-border transfer of your information takes place.</p>\n<ol>\n<li><strong> HOW WE PROTECT YOUR INFORMATION</strong></li>\n<li>Protecting Your Privacy and Data is Our Priority</li>\n</ol>\n<p>We always take reasonable physical, technical or managerial measures to protect the information collected via the Services from loss, misuse, and unauthorized access, disclosure, alteration, or destruction. However, no method of transmission over the Internet or method of electronic storage, is one hundred percent secure. In particular, emails sent to or from the Services may not be secure. Therefore, you should take special care in deciding what information you send to us via email.</p>\n<ol start=\"2\">\n<li>Compromise of Personal Information</li>\n</ol>\n<p>In the event that your personal information is compromised in a breach of security, we will promptly notify you in compliance with the applicable law. If such breach of security is caused by any of the following reasons, you hereby agree that we shall, in no circumstance, be held liable:</p>\n<ol>\n<li>Government or judicial authorities seize data from us in compliance with applicable laws, regulatory policies, administrative or judicial orders, or on the basis of other lawful grounds;</li>\n<li>Disclosure or exposure of any personal information resulting from your own actions or omissions resulting in the sharing or leaking your account or password;</li>\n<li>Any information disclosure caused by hacking, computer virus, trojans or other cybercrimes, or system failure or telecommunication malfunction, where it is commercially impractical for current technology to prevent or withstand such incidents;</li>\n<li>In the event of an emergency, which endangers public safety or another person&rsquo;s life, health or property, your information may be disclosed to mitigate the situation. If your rights have been jeopardized as a result, you may claim compensation from the beneficiary of such event under applicable laws; and</li>\n<li>Any disclosure of your information under an event of force majeure, or for any other cause that is not attributable to us.</li>\n<li><strong> YOUR RIGHTS ABOUT YOUR INFORMATION</strong></li>\n<li>General Rights</li>\n</ol>\n<p>Once you have completed your account registration and put in place reasonable and necessary authentication measures, you can review, modify, and delete the information you have submitted to us. In general, you can browse, modify, and delete your own information at any time, but you may not be able to modify certain information due to security or identification purposes.</p>\n<ol start=\"2\">\n<li>Rights under Different Jurisdictions</li>\n</ol>\n<p>As we provide our Services in many countries around the world, and the laws on data privacy varies from place to place, we have listed below the specific rights granted by different jurisdictions which may be applicable to you.</p>\n<ol>\n<li>Right to know. You have the right to be informed in a concise, transparent, intelligible and easily accessible form of the way in which your personal information is processed. You also have the right to obtain confirmation as to whether or not information concerning you is being processed.</li>\n<li>Right to access and copy. Where required by local laws, you shall have the right to obtain a copy of your data as long as it is technically and commercially practicable.</li>\n<li>Right to rectification/ deletion. You have the right to request to review, correct, update or delete inaccuracies to certain information about you that we keep on file by logging into your account to update your relevant information. You may also request for deletion of your personal information via the contact information provided in this Policy if you are not able to delete it on your own. Your personal information in your account will be deleted to the extent permitted by applicable law except for some data we retain for longer periods of time when necessary for legitimate business or legal purposes.</li>\n<li>Right to data portability. You have the right to data portability if it should become relevant and required by applicable laws.</li>\n<li>Right to withdraw your consent. Where you have provided your consent, you may withdraw your consent by managing your account settings or contacting us through the contact information provided in this Policy.&nbsp;<strong>You can also unsubscribe from certain emails and notifications by clicking the &ldquo;unsubscribe&rdquo; button or link or switching off relevant features</strong>. You can opt out from certain cookie-related processing by following the instructions given by the manual or help screen of your browsers.</li>\n<li>Right to change your privacy settings. You can change your privacy settings on our App, such as making your location/ gender/ age private.</li>\n<li>Right to delete your account. If you no longer want to use our Services, and would like your account to be deregistered, you may contact us via the contact information provided in this Policy, and we will provide you with further assistance and guide you through the process. However, please note that once you choose to delete your account, you will not be able to reactivate your account or retrieve any of the content or information associated or linked to that account.</li>\n<li>Right to complaint. In the event that you wish to make a complaint about how we process your personal data, please contact us in the first instance through the contact information provided in this Policy and we will endeavor to deal with your request as soon as possible. This is without prejudice to your right to launch a claim with the relevant data protection authority.</li>\n</ol>\n<p><strong>Unless otherwise indicated above, you can exercise any of the above rights, as applicable to you according to laws of your country, using the contact information provided in this Policy</strong>. We will respond to your request consistent with the applicable laws as soon as practicable after proper verification procedures.</p>\n<ol>\n<li><strong> COOKIES</strong></li>\n</ol>\n<p>When you use the Services, we may collect and store relevant information about your access to the Services through the use of various technologies, and we will be able to recognize you when you access or revisit the Services and provide you with a better experience. By understanding your usage habits through these small data files which identify you, we are able to save you from the need to repeatedly enter in account information, and/or to help monitor the security of your account. These data files may be cookies, flash cookies, or other local storage provided by your browser or associated applications (collectively referred to as \"cookies\").</p>\n<p>If you do not want us to collect your information through the use of cookies, you can set your web browser to reject cookies from the Services. Each browser is different, so you should check your browser&rsquo;s &ldquo;Help&rdquo; menu to learn how to change your cookie preferences. Please understand that some of our services can only be achieved through the use of cookies, and if you reject or block such essential cookies from the Services, the relevant Services may not function as intended.</p>\n<p><strong>VII. CHANGES TO THIS PRIVACY POLICY</strong></p>\n<p>All changes to this Privacy Policy may be made from time to time as we deem necessary and appropriate and will be effective from the time that they are posted on this page. When we make material changes to the Policy, we will provide you with notice on our App or via our Services, prior to the change becoming effective. If you do not or no longer agree with such changes, please stop your access and use of the App, Site, Software, and other Services. For minor changes made to the Policy, we will also update the &ldquo;Last Updated&rdquo; date at the top of this policy, which reflects the effective date of the policy. Users are strongly encouraged to check this Policy regularly for any changes.</p>\n<p><strong>VIII. GENERAL TERMS</strong></p>\n<ol>\n<li>Unsolicited Information</li>\n</ol>\n<p>You may provide us with ideas for new products, services or improvements to existing ones, and other voluntary and unsolicited submissions (collectively, &ldquo;Unsolicited Information&rdquo;). All Unsolicited Information shall be deemed to be non-confidential, and we shall be free to reproduce, use, disclose, and distribute such Unsolicited Information to others without limitation or attribution.</p>\n<ol start=\"2\">\n<li>Links to other Websites or Services</li>\n</ol>\n<p>We are not responsible for the practices employed by websites or services linked to or from our Services, including the information or content contained therein. When you use a link to go from our Services to another website or service, this Privacy Policy does not apply to such third-party websites or services. Your browsing and interaction on any third-party website or service, including such websites or services that have a link or advertisement on our website, are subject to that third party&rsquo;s own rules and policies.</p>\n<ol start=\"3\">\n<li>Notification Procedures</li>\n</ol>\n<p>It is our policy to provide notifications, whether such notifications are required by law or are for marketing or other business-related purposes, to you via email, written or hard copy notice, or through conspicuous posting of such notice on the Services, as determined by us in our sole discretion. We reserve the right to determine the form and means of providing notifications to you, provided that you may opt out of certain means of notification as described in this Privacy Policy.</p>\n<ol start=\"4\">\n<li>Children&rsquo;s Privacy</li>\n</ol>\n<p><strong>Our Services are not for users below age 18 (or the statutory age of majority in the user</strong><strong>&rsquo;</strong><strong>s state of nationality and residence, whichever is higher) and we do not knowingly collect personal information from such users.</strong>&nbsp;If you are a parent or guardian of a child and believe he or she has disclosed personal information to us, please immediately contact us via our contacts in this Policy. In the event that we learn that we have collected personal information from a child under age 18, we will halt the processing of such information and will take reasonable measures to promptly remove applicable information from our storage facilities.</p>\n<ol>\n<li><strong> CONTACTING US</strong></li>\n</ol>\n<p>If you have any questions about this Privacy Policy or your rights under applicable data protection law including any complaints or questions in relation to the content of our product, you may contact our global Data Protection Officer (who may be named differently in different jurisdictions) via contactezpzapp@gmail.com. We shall endeavor to address any complaints or questions consistent with the applicable laws as soon as practicable.&nbsp;</p>\n<ol>\n<li><strong> Jurisdiction-specific provisions</strong></li>\n</ol>\n<p><strong>California Privacy Disclosure</strong></p>\n<p>This California Privacy disclosure page supplements the EZPZ Privacy Policy, and applies to our users living in California only. This California Privacy disclosure page supplements the EZPZ. Privacy Policy. These additional disclosures are required by the California Consumer Privacy Act. This privacy disclosure page applies to California residents and information that identifies, relates to, describes, or could reasonably be linked, directly or indirectly, with California consumers (&ldquo;California Information&rdquo;).&nbsp;</p>\n<p><strong>Sale or Sharing of Personal Information</strong></p>\n<p>We share your personal information with third parties (such as advertising networks and analytics providers) for advertising-related purposes in accordance with your privacy settings and/or your consent. These disclosures of your personal information may be deemed a &ldquo;sale&rdquo; or &ldquo;sharing&rdquo; of personal information under California privacy laws.</p>\n<p>Under the California Consumer Privacy Act (CCPA), as amended by the California Privacy Rights Act (CPRA), a &ldquo;sale&rdquo; means disclosing or making available personal information to a third party in exchange for monetary or other valuable consideration. &ldquo;Sharing&rdquo; broadly includes disclosing or making available personal information to a third party for purposes of cross-context behavioral advertising or with affiliates and business partners.</p>\n<p>EZPZ does not sell or share sensitive personal information and does not sell or share the personal information of individuals we know are under 16 years of age in exchange for money or compensation.</p>\n<p>California residents may have the right to opt out of the sale or sharing of their personal information, as well as other rights under the CCPA/CPRA (such as the rights to know, delete, correct, and limit the use and disclosure of sensitive personal information). To exercise these rights, or to submit an opt-out request, please contact our Data Protection Officer at contactezpzapp@gmail.com.</p>\n<p><strong>Non-Discrimination</strong></p>\n<p>EZPZ will not discriminate against any consumer for exercising their rights under the California Consumer Privacy Act.</p>\n<p>&nbsp;</p>\n<p><strong>Appendix 1 &ndash; List of Information Collection</strong></p>\n<p>&nbsp;</p>\n<table>\n<tbody>\n<tr>\n<td width=\"74\">\n<p><strong>Type of information</strong></p>\n</td>\n<td width=\"95\">\n<p><strong>Information</strong></p>\n</td>\n<td width=\"178\">\n<p><strong>Purpose of collection</strong></p>\n</td>\n<td width=\"204\">\n<p><strong>Use of information</strong></p>\n</td>\n</tr>\n<tr>\n<td rowspan=\"3\" width=\"74\">\n<p>Account information</p>\n</td>\n<td width=\"95\">\n<p>Mobile phone number</p>\n</td>\n<td width=\"178\">\n<p>Account registration and login, sending SMS notifications</p>\n</td>\n<td width=\"204\">\n<p>When registering or logging in for the first time, sending SMS notification</p>\n</td>\n</tr>\n<tr>\n<td width=\"95\">\n<p>Login name</p>\n</td>\n<td width=\"178\">\n<p>Account registration and login</p>\n</td>\n<td width=\"204\">\n<p>When registering and logging in for the first time</p>\n</td>\n</tr>\n<tr>\n<td width=\"95\">\n<p>Login password</p>\n</td>\n<td width=\"178\">\n<p>Account registration and login</p>\n</td>\n<td width=\"204\">\n<p>When registering an account and logging in each time</p>\n</td>\n</tr>\n<tr>\n<td rowspan=\"4\" width=\"74\">\n<p>Third party account information - (e.g. users log in via Facebook, Google, etc. t attribution</p>\n</td>\n</tr>\n</tbody>\n</table>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p><strong>HAGO Singapore PTE. LTD.</strong></p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n</div>",
  "children": "\n    <div data-wrap style=\"font-size: 14px;direction: ltr;color:#000;font-weight:400;line-height:1.2;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',sans-serif;-webkit-tap-highlight-color:transparent;\">\n      <p><em>Effective Date: 28 October, 2025</em></p>\n<p><em>Latest Updated: 28 October, 2025</em></p>\n<p>&nbsp;</p>\n<p style=\"text-align: center;\"><strong>Child Safety Policy</strong></p>\n<p>EZPZ is committed to protecting children and strictly complies with applicable laws and regulations regarding the protection of minors in all jurisdictions where our users are located. We are dedicated to providing a safe and appropriate environment for children. Any user who violates this Policy or any other child safety rules of EZPZ may be subject to severe penalties, including being reported to relevant authorities or law enforcement agencies.</p>\n<p>This Policy takes effect upon publication and forms an integral part of the Terms of Service and User Agreement between you and EZPZ. Unless otherwise defined herein, terms used in this Policy shall have the same meanings as those in the Terms of Service.</p>\n<ol>\n<li><strong>Eligibility Requirements</strong></li>\n</ol>\n<p>You must be at least 18 years of age or the legal age of majority in your jurisdiction to access EZPZ.</p>\n<p>Users are strictly prohibited from providing false age information or otherwise attempting to circumvent age restrictions to access the App or its Services.</p>\n<ol>\n<li><strong>Prohibited Content and Conduct</strong></li>\n</ol>\n<p>We apply both AI and human review mechanisms to detect and address any conduct or content that may endanger children, including but not limited to:</p>\n<ul>\n<li>Creating, sharing, or distributing any content involving child sexual abuse or exploitation&mdash;whether virtual or real&mdash;including child sexual abuse/exploitation material (&ldquo;CSAE&rdquo;), child nudity, or any other form of child abuse.</li>\n<li>Kidnapping, abduction, or similar harmful activities involving children.</li>\n<li>Depictions of children engaged in illegal activities, violence, sexual behavior, pornography, drug use, smoking, shameful or other inappropriate behavior.</li>\n</ul>\n<ul>\n<li>Any predatory conduct toward children, including:</li>\n<li>Inappropriate physical contact or interaction.</li>\n<li>Child grooming (e.g., establishing trust with a child online to facilitate sexual contact or exchange of sexual imagery).</li>\n<li>Sexualization of minors.</li>\n<li>Sextortion (e.g., extorting a child using real or alleged intimate imagery).</li>\n<li>Child trafficking for sexual or commercial exploitation.</li>\n<li>Any other behavior or content that may negatively impact children or violate applicable child protection laws.</li>\n<li>Soliciting, inducing, pressuring, or encouraging minors to purchase Diamonds with real world currency.</li>\n</ul>\n<ol>\n<li><strong>Live Broadcasting involving Minors</strong></li>\n</ol>\n<p>Live broadcasts featuring minors are strictly prohibited. EZPZ will closely monitor live content to identify the presence of minors. If minors are detected participating without proper authorization, the live broadcast will be immediately terminated and relevant accounts may be suspended or subject to further enforcement actions.</p>\n<ol>\n<li><strong>Reporting Channels</strong></li>\n</ol>\n<p>We provide multiple avenues for reporting concerns involving children:</p>\n<ul>\n<li><strong>In-App Reporting:</strong> You can select \"Report Child Content\" on user profiles, posts, rooms, or other relevant interfaces.</li>\n<li><strong>Customer Support:</strong> The FAQ section in the Help Center provides guidance on reporting suspected child abuse or exploitation.</li>\n<li><strong>Email:</strong> Reports may also be submitted to us at <strong>serviceezpz@gmail.com</strong> with detailed information.</li>\n</ul>\n<ol>\n<li><strong>Enforcement Actions</strong></li>\n</ol>\n<p>Violations of this Policy will result in enforcement actions, which may include removal of content, account suspension, termination, and other necessary measures.</p>\n<ol>\n<li><strong>Cooperation with Authorities</strong></li>\n</ol>\n<p>Where appropriate, we may report violations to app distribution platforms, the National Center for Missing &amp; Exploited Children (NCMEC), or other relevant law enforcement agencies, authorities, or child protection organizations.</p>\n<ol>\n<li><strong>Transparency</strong></li>\n</ol>\n<p>We will periodically update and publish information about this Policy and our enforcement practices in accordance with applicable laws and regulations.</p>\n<ol>\n<li><strong>Child Protection Resources</strong></li>\n</ol>\n<p>If you encounter or suspect child abuse, you are encouraged to contact your local authority or child protection organization. Below are useful reporting resources for reference:</p>\n<ul>\n<li><strong>USA</strong> - NCMEC:&nbsp;<a href=\"https://report.cybertip.org/\">report.cybertip.org/</a></li>\n</ul>\n<ul>\n<li><strong>Brazil</strong> - SaferNet Brasil:&nbsp;<a href=\"http://new.safernet.org.br/\">new.safernet.org</a><a href=\"http://new.safernet.org.br/\">.br</a></li>\n</ul>\n<ul>\n<li><strong>India</strong> - IWF India reporting portal:&nbsp;<a href=\"https://report.iwf.org.uk/in\">https://report.iwf.org.uk/in</a></li>\n</ul>\n<ul>\n<li><strong>Indonesia</strong> - TePSA Kemensos:&nbsp;<a href=\"http://www.facebook.com/TePSAKEMENSOS/\">www.facebook.com/TePSAKEMENSOS/</a></li>\n</ul>\n<ul>\n<li><strong>Thailand</strong> - Childline Thailand 1387:&nbsp;<a href=\"https://childlinethailand.org/\">https://childlinethailand.org/</a></li>\n</ul>\n<ul>\n<li><strong>Vietnam</strong> - Child Helpline Vietnam 111:&nbsp;<a href=\"http://tongdai111.vn/\">http://tongdai111.vn/</a></li>\n</ul>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n    </div>\n  "

<script>// Two decoders overlap the tail after 6 s with the next clip's first frames.
class HeroVideoController {
  constructor(videos, options={}) {
    this.videos=videos;this.options=options;this.front=0;this.phase='idle';
    this.running=false;this.destroyed=false;this.raf=null;this.token=0;
    this.brandRevealed=Boolean(options.brandRevealed);
    videos.forEach(v=>{v.muted=true;v.loop=false;v.playsInline=true;v.style.opacity='1';});
    this.paint();
  }
  paint(){this.videos.forEach((v,i)=>v.style.zIndex=i===this.front?'2':'1');}
  revealBrand(duration){if(!this.brandRevealed){this.brandRevealed=true;this.options.onBrandReveal?.(duration);}}
  async resume(){
    if(this.destroyed||this.running)return;this.running=true;const token=++this.token;
    try{
      if(this.phase==='fading')await Promise.all(this.videos.map(v=>v.play()));
      else await this.videos[this.front].play();
      if(!this.running||this.destroyed||token!==this.token){if(!this.running)this.videos.forEach(v=>v.pause());return;}
      this.options.onPlaying?.();this.schedule();
    }catch(error){if(token===this.token){this.running=false;this.options.onBlocked?.(error);}}
  }
  pause(){this.running=false;++this.token;cancelAnimationFrame(this.raf);this.raf=null;this.videos.forEach(v=>v.pause());}
  schedule(){if(this.running&&!this.destroyed&&this.raf===null)this.raf=requestAnimationFrame(()=>{this.raf=null;this.step();this.schedule();});}
  async startNext(){
    if(this.phase!=='idle'||!this.running||this.destroyed)return;
    const next=this.videos[1-this.front];this.phase='starting';next.currentTime=0;next.style.opacity='1';
    const token=this.token;
    try{
      await next.play();
      if(this.destroyed||!this.running||token!==this.token){next.pause();if(!this.destroyed)this.phase='idle';return;}
      this.phase='fading';
    }catch(error){this.phase='idle';this.pause();this.options.onBlocked?.(error);}
  }
  step(){
    if(this.destroyed||!this.running)return;
    const front=this.videos[this.front],duration=front.duration;
    if(!Number.isFinite(duration)||duration<=0)return;
    const fadeStart=Math.min(6,Math.max(0,duration-.3));
    const fadeDuration=Math.max(.05,duration-fadeStart);
    if(front.currentTime>=fadeStart){
      this.revealBrand(fadeDuration);
      if(this.phase==='idle')this.startNext();
    }
    if(this.phase==='fading'){
      const alpha=Math.max(0,Math.min(1,(front.currentTime-fadeStart)/fadeDuration));
      front.style.opacity=String(1-alpha);
      // Keep the incoming decoder at its current time: do not restart it here.
      if(alpha>=.995||front.ended){
        const outgoing=this.front;this.front=1-this.front;this.phase='idle';
        this.paint();this.videos[this.front].style.opacity='1';
        this.videos[outgoing].pause();this.videos[outgoing].style.opacity='1';this.videos[outgoing].currentTime=0;
        this.options.onLoop?.();
      }
    }
  }
  destroy(){this.pause();this.destroyed=true;}
}

function fitMobileHome(force=false){

function prepareHomeLoop(){
 const deck=$('.home-deck');if(!deck||$('.loop-clone',deck))return;
 const originals=$$('.home-slide',deck);
 for(const [source,prepend] of [[originals.at(-1),true],[originals[0],false]]){
  const clone=source.cloneNode(true);clone.classList.add('loop-clone');clone.removeAttribute('id');$$('[id]',clone).forEach(el=>el.removeAttribute('id'));$$('h1',clone).forEach(el=>{const title=document.createElement('div');title.className=el.className+' hero-loop-title';title.innerHTML=el.innerHTML;el.replaceWith(title);});$$('video',clone).forEach(v=>v.remove());clone.inert=true;clone.setAttribute('aria-hidden','true');
  if(prepend)deck.prepend(clone);else deck.append(clone);
 }
 deck.addEventListener('transitionend',event=>{if(event.target===deck&&event.propertyName==='transform')settleLoop();});
}
function deckTransform(position){return window.innerWidth<=680?`translate3d(${-position*100}%,0,0)`:`translate3d(0,${-position*100}%,0)`;}

 clearTimeout(loopTimer);loopTimer=null;const deck=$('.home-deck');if(!deck)return;
 if(deck.dataset.wrapping!=='true')return;deck.dataset.wrapping='false';deck.style.transition='none';deck.style.transform=deckTransform(homeSlide+1);void deck.offsetHeight;
 requestAnimationFrame(()=>{if(deck.isConnected)deck.style.transition='';});
}
function clearHomeAdvance(){clearTimeout(autoNextTimer);autoNextTimer=null;}
function autoAdvanceAllowed(){return !AUTO_ADVANCE_PAUSED&&activePage==='home'&&!document.hidden&&!$('#dialog-root').firstElementChild&&!$('#mobile-nav')?.classList.contains('open')&&!touchStart&&!(window.visualViewport?.scale>1.01);}
function scheduleHomeAdvance(){
 clearHomeAdvance();if(!autoAdvanceAllowed())return;
 if(homeSlide===0&&!homeVideoLapComplete)return;
 const videoSeconds=heroPlayer?.videos[0]?.duration;
 const fullScreenDuration=(Number.isFinite(videoSeconds)&&videoSeconds>0?videoSeconds:6.708333)*1000+1000;
 const slide=homeSlide,delay=slide===0?1000:fullScreenDuration;
 autoNextTimer=setTimeout(()=>{autoNextTimer=null;if(autoAdvanceAllowed()&&homeSlide===slide)setHomeSlide(slide+1,true);},delay);
}
function setHomeSlide(index,loop=false){
 clearHomeAdvance();clearTimeout(loopTimer);loopTimer=null;const previous=homeSlide;homeSlide=((index%screenTotal)+screenTotal)%screenTotal;if(homeSlide===0&&previous!==0){homeVideoLapComplete=false;disposeHeroVideo();}const deck=$('.home-deck');if(!deck)return;

 deck.dataset.wrapping=String(wrap);deck.style.transition='';deck.style.transform=deckTransform(wrap?(index>=screenTotal?screenTotal+1:0):homeSlide+1);
 if(wrap)loopTimer=setTimeout(settleLoop,680);
 $$('.home-slide:not(.loop-clone)').forEach((el,i)=>{if(i!==homeSlide&&el.contains(document.activeElement))$('#main-content').focus({preventScroll:true});el.setAttribute('aria-hidden',String(i!==homeSlide));el.inert=i!==homeSlide;el.classList.toggle('is-active',i===homeSlide);});
 $$('[data-slide]').forEach((el,i)=>{el.classList.toggle('active',i===homeSlide);el.setAttribute('aria-current',i===homeSlide?'true':'false');});
 $('.home-stage').dataset.screen=String(homeSlide);requestAnimationFrame(()=>{updateVideoSize();fitMobileHome();const nav=$('.screen-nav'),selected=$('.screen-nav button.active');if(nav&&selected&&nav.scrollWidth>nav.clientWidth&&typeof nav.scrollTo==='function')nav.scrollTo({left:selected.offsetLeft-(nav.clientWidth-selected.offsetWidth)/2,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});});

}

function disposeHeroVideo(){if(heroPlayer){heroPlayer.destroy();heroPlayer=null;}}
function freezeHeroLoopPreview(){
 if(!heroPlayer)return;const videos=heroPlayer.videos;if(!videos.some(v=>v.readyState>=2))return;
 $$('.loop-clone .hero-video-stage').forEach(stage=>{
  const canvas=document.createElement('canvas');canvas.className='hero-loop-freeze';canvas.width=videos[0].videoWidth;canvas.height=videos[0].videoHeight;
  if(!canvas.width||!canvas.height)return;const ctx=canvas.getContext('2d');if(!ctx)return;
  const order=[videos[1-heroPlayer.front],videos[heroPlayer.front]];for(const v of order){if(v.readyState>=2){ctx.globalAlpha=Number(v.style.opacity||1);ctx.drawImage(v,0,0,canvas.width,canvas.height);}}
  stage.replaceChildren(canvas);
 });
}
function syncHeroVideo(){
 const frame=$('#hello .hero-media-video');if(!frame){disposeHeroVideo();return;}
 const source=window.innerWidth<=680?(HERO_MEDIA.portrait||HERO_MEDIA.landscape):(HERO_MEDIA.landscape||HERO_MEDIA.portrait);
 const videos=$$('video',frame);if(videos.length!==2)return;
 if(!heroPlayer||heroPlayer.videos[0]!==videos[0]||heroPlayer.source!==source){
  disposeHeroVideo();videos.forEach(v=>{v.src=source;v.muted=true;v.load();});
  heroPlayer=new HeroVideoController(videos,{brandRevealed:heroBrandRevealed,onBrandReveal:duration=>{
   heroBrandRevealed=true;$$('.hero-brand-overlay').forEach(el=>{el.style.setProperty('--brand-fade-duration',duration+'s');el.classList.add('is-visible');});
  },onLoop:()=>{if(activePage==='home'&&homeSlide===0&&!homeVideoLapComplete){homeVideoLapComplete=true;scheduleHomeAdvance();}},onPlaying:()=>{frame.classList.add('has-video');$('.hero-play-fallback',frame).hidden=true;},onBlocked:()=>{$('.hero-play-fallback',frame).hidden=false;}});
  heroPlayer.source=source;
 }
 const active=activePage==='home'&&homeSlide===0&&!document.hidden;
 if(active&&(!matchMedia('(prefers-reduced-motion: reduce)').matches||heroUserStarted))heroPlayer.resume();
 else{freezeHeroLoopPreview();heroPlayer.pause();if(active)$('.hero-play-fallback',frame).hidden=false;}
}

function policyPage(key){const t=data(),p=t.policy;const current=['terms','privacy','children'].includes(key);const title=t.footer[key]||t.footer.terms;const body=current?`<p class="note">${p.sourceNote}</p><article class="legal-article" lang="en">${POLICIES[key]}</article><p class="draft-link">${external(LINKS[key],p.official+icon('arrow'),'text-link')}</p>`:`<p class="note">${p.draftNote}</p><h2 class="outline-heading">${p.outline}</h2><div class="outline-sections">${(OUTLINES[key]?.[lang]||OUTLINES[key]?.en||[]).map(([heading,text],i)=>`<section><h2>0${i+1}. ${heading}</h2><p>${text}</p></section>`).join('')}</div>${key==='cookies'?`<p class="draft-link"><button class="button secondary" data-action="cookies">${t.footer.settings}${icon('cookie')}</button></p>`:''}`;return intro(title,t.policyDescriptions[key],current?p.source:p.draftLabel)+`<section class="page-body"><div class="wrap policy-layout"><nav class="policy-nav" aria-label="Policies">${policyKeys.map(k=>link(k==='law'?'law-enforcement':'policy/'+k,t.footer[k],key===k?'active':'')).join('')}</nav><div>${body}<p style="margin-top:40px">${link('safety',p.back+icon('arrow'),'text-link')}</p></div></div></section>`;}
function render(){
  setMobileMenu(false);
  clearHomeAdvance();homeVideoLapComplete=false;
  disposeHeroVideo();
  clearTimeout(loopTimer);loopTimer=null;
  const previous=activePage;
  const parts=(location.hash.replace(/^#\/?/,'')||'home').split('?');
  let route=parts[0];const section=new URLSearchParams(parts[1]||'').get('section');
  if(!['home','about','help','contact','safety','law-enforcement',...policyKeys.filter(x=>x!=='law').map(x=>'policy/'+x)].includes(route))route='home';
  activePage=route;document.body.classList.toggle('home-mode',route==='home');document.body.classList.remove('motion-ready');
  if(route==='home'&&section&&slideIds.includes(section))homeSlide=slideIds.indexOf(section);else if(route==='home'&&previous!=='home')homeSlide=0;
  document.documentElement.lang=lang==='zh'?'zh-CN':lang;
  document.title=(route==='home'?'Ezpz — '+(lang==='zh'?'相遇，让快乐多一点':lang==='hi'?'मिलें, लाइव आएँ और दोस्त बनाएँ':'Party, live stream and make friends'):(data().nav[route]||data().footer[route.split('/')[1]]||data().footer.law)+' — Ezpz');
  renderHeader();renderFooter();
  $('#main-content').innerHTML=route==='home'?homePage():route==='about'?aboutPage():route==='help'?helpPage():route==='contact'?contactPage():route==='safety'?safetyPage():policyPage(route==='law-enforcement'?'law':route.split('/')[1]);
  if(route==='help')renderFaq();if(route==='home'){setHomeSlide(homeSlide);playOpening();}observeHomeLayout();
  if(observer)observer.disconnect();
  if(route!=='home'&&'IntersectionObserver' in window&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
    document.body.classList.add('motion-ready');
    observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');observer.unobserve(e.target);}}),{threshold:.08});
    $$('.reveal').forEach(el=>observer.observe(el));
  }
  requestAnimationFrame(()=>{
    if(route==='home'){if(section==='download')showDownload();}
    else if(section&&$('#'+CSS.escape(section)))$('#'+CSS.escape(section)).scrollIntoView({behavior:'auto',block:'start'});
    else window.scrollTo({top:0,behavior:'auto'});
    if(previous&&previous!==route)$('#main-content').focus({preventScroll:true});
  });
}
function toast(message){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').classList.add('show');toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),4000);}
function closeDialog(){$$('[data-action=more-downloads]').forEach(button=>button.setAttribute('aria-expanded','false'));const root=$('#dialog-root');root.innerHTML='';document.body.style.overflow='';if(lastDialogFocus?.isConnected)lastDialogFocus.focus({preventScroll:true});scheduleHomeAdvance();}
function openDialog(inner,drawer=false){clearHomeAdvance();lastDialogFocus=document.activeElement;$('#dialog-root').innerHTML=`<div class="dialog-backdrop" data-action="backdrop"><section class="${drawer?'review-drawer':'modal-shell'}" role="dialog" aria-modal="true" aria-labelledby="dialog-heading" tabindex="-1">${inner}</section></div>`;document.body.style.overflow='hidden';$('.dialog-backdrop section').focus({preventScroll:true});}
function closeButton(){return `<button class="close-button" data-action="close-dialog" aria-label="Close dialog">${icon('close')}</button>`;}
function showCookies(){const c=data().cookie;let saved={};try{saved=JSON.parse(storage.get('ezpz-preview-cookies')||'{}');}catch{}openDialog(`<div class="dialog-title"><h2 id="dialog-heading">${c.title}</h2>${closeButton()}</div><p>${c.intro}</p><div class="cookie-option"><div><strong>${c.essential}</strong><p>${c.essentialText}</p></div><small>${c.always}</small></div><label class="cookie-option"><div><strong>${c.analytics}</strong><p>${c.analyticsText}</p></div><input id="analytics-choice" type="checkbox" ${saved.analytics?'checked':''}></label><p class="modal-note">${c.note}</p><div class="modal-actions"><button class="button secondary" data-action="cookie-reject">${c.reject}</button><button class="button" data-action="cookie-save">${c.save}</button></div>`);}
document.addEventListener('change',event=>{if(event.target.id==='language'){lang=event.target.value;storage.set('ezpz-preview-language',lang);render();}});
document.addEventListener('input',event=>{if(event.target.id==='faq-search'){searchQuery=event.target.value;renderFaq();}});
document.addEventListener('click',event=>{
 const anchor=event.target.closest('a[href]');if(anchor?.getAttribute('href')==='#/home?section=download'){event.preventDefault();setMobileMenu(false);showDownload();return;}
 const dot=event.target.closest('[data-slide]');if(dot){setHomeSlide(Number(dot.dataset.slide));return;}
 if(activePage==='home'&&anchor?.getAttribute('href')==='#/home'){event.preventDefault();setHomeSlide(0);setMobileMenu(false);scheduleHomeAdvance();return;}

 if(event.target.closest('.skip-link')){event.preventDefault();$('#main-content').focus();$('#main-content').scrollIntoView({block:'start'});return;}
 const category=event.target.closest('[data-category]');if(category){helpCategory=category.dataset.category;$$('[data-category]').forEach(el=>{el.classList.toggle('active',el===category);el.setAttribute('aria-pressed',String(el===category));});renderFaq();return;}
 if(event.target.closest('#menu-toggle')){setMobileMenu(!$('#mobile-nav').classList.contains('open'));return;}
 const action=event.target.closest('[data-action]')?.dataset.action;
 if(action==='start-hero-video'){heroUserStarted=true;syncHeroVideo();return;}
 if(action==='more-downloads'){showMoreDownloads(event.target.closest('[data-action=more-downloads]'));return;}
 if(action==='preview-download'){const key=event.target.closest('[data-channel]').dataset.channel;const destination=LINKS[key];if(destination){window.open(destination,'_blank','noopener,noreferrer');}else{toast(PRODUCT_COPY[lang].pending);}return;}
 if(action==='close-dialog'||(action==='backdrop'&&event.target.classList.contains('dialog-backdrop'))){closeDialog();return;}
 if(action==='cookies'){showCookies();return;}
 if(action==='cookie-save'||action==='cookie-reject'){storage.set('ezpz-preview-cookies',JSON.stringify({analytics:action==='cookie-save'&&$('#analytics-choice').checked,updatedAt:new Date().toISOString()}));closeDialog();toast(data().cookie.saved);return;}
 if(event.target.closest('#form-again')){render();return;}
 if(event.target.closest('#mobile-nav a'))setMobileMenu(false);
});
document.addEventListener('submit',event=>{if(event.target.id!=='contact-form')return;event.preventDefault();if(!event.target.checkValidity()){event.target.reportValidity();return;}$('#form-result').innerHTML=`<div class="form-result">${data().contact.success}</div><button class="text-link" id="form-again">${data().contact.again}${icon('arrow')}</button>`;event.target.hidden=true;$('#form-result').scrollIntoView({block:'center',behavior:'smooth'});});
document.addEventListener('keydown',event=>{if(!$('#dialog-root').firstElementChild){if(event.key==='Escape'&&$('#mobile-nav')?.classList.contains('open')){setMobileMenu(false);$('#menu-toggle').focus();}return;}if(event.key==='Escape'){event.preventDefault();closeDialog();return;}if(event.key==='Tab'){const list=$$('a[href],button,input,select,textarea,[tabindex="0"]',$('#dialog-root')).filter(el=>!el.disabled);if(!list.length)return;const first=list[0],last=list.at(-1);if(event.shiftKey&&(document.activeElement===first||document.activeElement=== $('.dialog-backdrop section'))){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
function canNavigate(){return activePage==='home'&&!$('#dialog-root').firstElementChild&&!$('#mobile-nav')?.classList.contains('open');}
function needsInnerScroll(target,direction){const slide=target.closest?.('.home-slide');return !!slide&&slide.scrollHeight>slide.clientHeight+2&&(direction>0?slide.scrollTop+slide.clientHeight<slide.scrollHeight-2:slide.scrollTop>2);}
document.addEventListener('wheel',event=>{
 if(!canNavigate()||!event.target.closest('.home-stage')||event.ctrlKey||window.visualViewport?.scale>1.01)return;
 if(window.innerWidth<=680||needsInnerScroll(event.target,Math.sign(event.deltaY)))return;
 event.preventDefault();if(wheelQuiet)return;wheelAmount+=event.deltaMode===1?event.deltaY*16:event.deltaY;if(Math.abs(wheelAmount)<35)return;moveSlide(Math.sign(wheelAmount));wheelAmount=0;wheelQuiet=1;
},{passive:false});
let wheelTimer;document.addEventListener('wheel',()=>{clearTimeout(wheelTimer);wheelTimer=setTimeout(()=>{wheelQuiet=0;wheelAmount=0;},200);},{passive:true});
document.addEventListener('keydown',event=>{if(!canNavigate()||event.target.closest?.('input,select,textarea,button,a')||window.visualViewport?.scale>1.01)return;const keys=window.innerWidth<=680?['ArrowLeft','ArrowRight']:['ArrowUp','ArrowDown'];if([keys[0],keys[1],'PageDown','PageUp','Home','End'].includes(event.key)){if(needsInnerScroll(event.target,event.key===keys[0]||event.key==='PageUp'?-1:1)&&!['Home','End'].includes(event.key))return;event.preventDefault();if(event.key==='Home')setHomeSlide(0);else if(event.key==='End')setHomeSlide(screenTotal-1);else moveSlide(event.key===keys[0]||event.key==='PageUp'?-1:1);}});
document.addEventListener('touchstart',event=>{
 touchStart=null;if(!canNavigate()||!event.target.closest('.home-stage')||event.target.closest('button,a,input,select,textarea'))return;
 if(event.touches.length!==1||window.visualViewport?.scale>1.01)return;
 const point=event.touches[0];if(point.clientX<28||point.clientX>window.innerWidth-28)return;
 touchStart={x:point.clientX,y:point.clientY,cancelled:false};
},{passive:true});
document.addEventListener('touchmove',event=>{
 if(!touchStart)return;if(event.touches.length!==1||window.visualViewport?.scale>1.01){touchStart=null;return;}
 const dx=touchStart.x-event.touches[0].clientX,dy=touchStart.y-event.touches[0].clientY;
 if(window.innerWidth<=680&&Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx))touchStart.cancelled=true;
},{passive:true});
document.addEventListener('touchend',event=>{
 if(!touchStart)return;const start=touchStart;touchStart=null;if(start.cancelled||!canNavigate()||!event.changedTouches.length||window.visualViewport?.scale>1.01)return;
 const dx=start.x-event.changedTouches[0].clientX,dy=start.y-event.changedTouches[0].clientY;
 if(window.innerWidth<=680){if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.4)moveSlide(Math.sign(dx));}
 else if(Math.abs(dy)>50&&Math.abs(dy)>Math.abs(dx)*1.4&&!needsInnerScroll(event.target,Math.sign(dy)))moveSlide(Math.sign(dy));
},{passive:true});
document.addEventListener('touchcancel',()=>{touchStart=null;},{passive:true});
window.addEventListener('resize',()=>{if(window.innerWidth>680)setMobileMenu(false);if(activePage==='home')setHomeSlide(homeSlide);});
document.addEventListener('visibilitychange',()=>{syncHeroVideo();scheduleHomeAdvance();});
document.addEventListener('touchstart',event=>{if(event.target.closest?.('.home-stage'))clearHomeAdvance();},{passive:true});
document.addEventListener('touchend',scheduleHomeAdvance,{passive:true});
document.addEventListener('touchcancel',scheduleHomeAdvance,{passive:true});
window.visualViewport?.addEventListener('resize',scheduleHomeAdvance);
window.addEventListener('hashchange',()=>{closeDialog();render();});

// Keep source text slots and navigation widths fixed when product copy changes.
function alignProductSlots(){
 const reference=ALIGN_REFERENCE[lang];if(!reference)return;
 const issues=[];
 function reserve(element,referenceHtml){
  if(!element)return;
  element.style.removeProperty('height');element.style.removeProperty('min-height');
  const width=element.getBoundingClientRect().width;if(!width)return;
  const probe=element.cloneNode(false);probe.innerHTML=referenceHtml;
  probe.setAttribute('aria-hidden','true');probe.inert=true;
  Object.assign(probe.style,{position:'fixed',left:'0',top:'-99999px',width:width+'px',height:'auto',minHeight:'0',maxHeight:'none',visibility:'hidden',pointerEvents:'none'});
  element.parentElement.appendChild(probe);
  const height=probe.getBoundingClientRect().height,referenceScrollHeight=probe.scrollHeight;probe.remove();
  element.style.height=height+'px';element.style.minHeight=height+'px';
  if(element.scrollHeight>referenceScrollHeight+2)issues.push({selector:element.tagName+'.'+element.className,text:element.textContent,referenceHeight:height,actualHeight:element.scrollHeight});
 }
 reserve($('.entity-name'),'HAGO SINGAPORE PTE. LTD.');
 reserve($('.entity-address'),'30 PASIR PANJANG ROAD #15-31A MAPLETREE BUSINESS CITY SINGAPORE 117440');
 if(activePage==='home'){
  reserve($('#hello h1'),reference.home.title);reserve($('#hello .hero-description'),reference.home.description);
  reference.home.scenes.forEach(s=>{
   reserve($('#'+s.id+' .scene-copy h2'),s.title);reserve($('#'+s.id+' .scene-copy>p'),s.description);
  });
  const referenceLabels=[reference.nav.home,...reference.home.scenes.map(s=>s.title)];
  $$('.screen-nav button').forEach((button,i)=>{
   button.style.removeProperty('width');button.style.removeProperty('min-width');
   const probe=button.cloneNode(true);$('span',probe).textContent=referenceLabels[i];
   probe.setAttribute('aria-hidden','true');probe.inert=true;
   Object.assign(probe.style,{position:'fixed',left:'0',top:'-99999px',width:'auto',visibility:'hidden',pointerEvents:'none'});
   button.parentElement.appendChild(probe);const width=probe.getBoundingClientRect().width;probe.remove();
   button.style.width=width+'px';button.style.minWidth=width+'px';
  });
  fitMobileHome(true);
 }else{
  let introText=reference[activePage]?.intro;
  if(activePage.startsWith('policy/'))introText=reference.policyDescriptions[activePage.split('/')[1]];
  if(activePage==='law-enforcement')introText=reference.policyDescriptions.law;
  if(introText)reserve($('.page-intro>.wrap>p'),introText);
  const band=$('.download-band>.wrap');
  if(band){
   const probe=band.cloneNode(true);
   $('h2',probe).innerHTML=reference.home.downloadTitle;
   $('p',probe).innerHTML=reference.home.downloadText;
   for(const e of [probe.firstElementChild,$('h2',probe),$('p',probe)])e.removeAttribute('style');
   probe.setAttribute('aria-hidden','true');probe.inert=true;
   Object.assign(probe.style,{position:'fixed',left:'0',top:'-99999px',width:band.getBoundingClientRect().width+'px',visibility:'hidden',pointerEvents:'none'});
   band.parentElement.appendChild(probe);
   const width=probe.firstElementChild.getBoundingClientRect().width;probe.remove();
   band.firstElementChild.style.width=width+'px';
  }
  reserve($('.download-band h2'),reference.home.downloadTitle);
  reserve($('.download-band p'),reference.home.downloadText);
  if(activePage.startsWith('policy/')){
   const key=activePage.split('/')[1];
   const article=$('.legal-article');
   if(ALIGN_POLICIES[key]&&article){
    article.style.removeProperty('height');article.style.removeProperty('min-height');
    const official=article.innerHTML,parent=article.parentElement;
    article.innerHTML=ALIGN_POLICIES[key];
    const referenceHeight=article.getBoundingClientRect().height;
    const parentHeight=parent.getBoundingClientRect().height;
    article.innerHTML=official;article.style.height=referenceHeight+'px';
    const correction=parentHeight-parent.getBoundingClientRect().height;
    article.style.height=(referenceHeight+correction)+'px';
   }
  }
  if(activePage==='help'){
   $$('.faq-item summary').forEach(summary=>{
    const index=data().faqs.findIndex(f=>f[1]===summary.textContent);
    if(index>=0){reserve(summary,reference.faqs[index][1]);reserve($('.faq-answer',summary.parentElement),reference.faqs[index][2]);}
   });
   reserve($('.support-guide h3'),reference.help.preparation.title);
   $$('.support-guide li').forEach((li,i)=>reserve(li,reference.help.preparation[helpCategory][i]));
  }
  if(activePage==='about'){
   reserve($('.about-copy h2'),reference.about.heading);
   $$('.about-copy>p').forEach((p,i)=>reserve(p,reference.about.paragraphs[i]));
   $$('.about-values article').forEach((article,i)=>{reserve($('h3',article),reference.about.values[i][0]);reserve($('p',article),reference.about.values[i][1]);});
  }
  reserve($('.footer-brand>p'),reference.footer.tagline);
  if(activePage==='contact'){
   const email=$('.contact-choice a[href^="mailto:"]');
   if(email){
    email.style.removeProperty('width');const probe=email.cloneNode(true);
    const text=[...probe.childNodes].find(n=>n.nodeType===Node.TEXT_NODE);if(text)text.textContent=atob('b2xhcGFydHlzZXJ2aWNlQGdtYWlsLmNvbQ==');
    probe.setAttribute('aria-hidden','true');probe.inert=true;
    Object.assign(probe.style,{position:'fixed',left:'0',top:'-99999px',width:'auto',visibility:'hidden'});
    email.parentElement.appendChild(probe);const width=probe.getBoundingClientRect().width;probe.remove();
    email.style.width=width+'px';email.style.justifyContent='space-between';
   }
  }
 }
 window.EZPZ_ALIGNMENT={sourceVersion:19,issues};
 document.documentElement.setAttribute('data-alignment-issues',JSON.stringify(issues));
 document.documentElement.setAttribute('data-alignment-language',lang);
 document.documentElement.setAttribute('data-alignment-width',String(window.innerWidth));
}
const renderAlignedProduct=render;
render=function(){renderAlignedProduct();requestAnimationFrame(alignProductSlots);document.fonts?.ready.then(alignProductSlots);};
const renderAlignedFaq=renderFaq;
renderFaq=function(){renderAlignedFaq();requestAnimationFrame(alignProductSlots);};
document.addEventListener('toggle',event=>{if(activePage==='help'&&event.target.matches('.faq-item'))requestAnimationFrame(alignProductSlots);},true);
window.addEventListener('resize',()=>requestAnimationFrame(alignProductSlots));


document.addEventListener('click',event=>{const a=event.target.closest('a');if(a&&a.getAttribute('href')===''){event.preventDefault();toast(PRODUCT_COPY[lang].recharge);}});

render();
})();
</script>
